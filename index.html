<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ptolus — City Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar">
    <header>
      <span class="ornament">✦ ✦ ✦</span>
      <h1>Ptolus</h1>
      <p class="subtitle">City Map</p>
    </header>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="Search locations…" autocomplete="off" spellcheck="false">
      <button id="clear-search" title="Clear" aria-label="Clear search">✕</button>
    </div>
    <ul id="results" role="listbox"></ul>
    <button id="calibrate-btn">Calibrate locations</button>
  </aside>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
